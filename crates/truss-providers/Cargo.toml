[package]
name = "truss-providers"
description = "Feature-gated Truss model-provider integrations for Anthropic and OpenAI-compatible APIs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["provider-anthropic", "provider-openai"]
provider-anthropic = ["dep:reqwest"]
provider-openai = ["dep:reqwest"]
provider-openai-codex = ["dep:reqwest"]

[dependencies]
truss-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
async-stream = "0.3"
futures = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6"
